# Fly.io deployment for the MDM TapCard Web Frontend.
# Deploy: `cd apps/web && fly launch --no-deploy` (first time) then `fly deploy`.

app = "mdm-tapcard-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # API base URL for connecting to the backend
  NEXT_PUBLIC_API_URL = "https://api.mdmsolutionlab.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
