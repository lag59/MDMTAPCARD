name: mdm_tapcard
description: MDM TapCard — NFC business card writer and manager
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # NFC reading and writing (iOS Core NFC + Android NFC)
  nfc_manager: ^3.3.0
  # HTTP client
  dio: ^5.7.0
  # Secure token storage
  flutter_secure_storage: ^9.2.2
  # QR code display
  qr_flutter: ^4.1.0
  # State management
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.6.1
  # Internationalization (EN / ES)
  intl: ^0.19.0
  # Image picker for profile photos
  image_picker: ^1.1.2
  # Shared preferences
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
