# Fly.io deployment for the MDM TapCard API.
# Deploy: `cd apps/api && fly launch --no-deploy` (first time) then `fly deploy`.
# Set secrets with: `fly secrets set SECRET_KEY=... DATABASE_URL=... STORAGE_*=...`

app = "mdm-tapcard-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Run database migrations on every deploy.
[deploy]
  release_command = "python -m alembic upgrade head"

# Non-secret ship-from address used to generate Shippo shipping labels.
[env]
  SHIP_FROM_NAME = "MDM Creation"
  SHIP_FROM_COMPANY = "MDM Creation"
  SHIP_FROM_STREET1 = "1494 Millstone Drive"
  SHIP_FROM_CITY = "Creedmoor"
  SHIP_FROM_STATE = "NC"
  SHIP_FROM_ZIP = "27522"
  SHIP_FROM_COUNTRY = "US"
  SHIP_FROM_PHONE = "9843029783"
  SHIP_FROM_EMAIL = "admin@mdmcreation.com"
  ADMIN_NOTIFICATION_EMAIL = "andrea@andreabilingualcpr.com"
  SMTP_HOST = "smtp.office365.com"
  SMTP_PORT = "587"
  SMTP_USE_SSL = "false"
  SMTP_FROM_EMAIL = "andrea@andreabilingualcpr.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
