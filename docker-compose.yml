services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdmtapcard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mdmtapcard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "true"
      SECRET_KEY: replace-with-a-long-random-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mdmtapcard
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      PROFILE_BASE_URL: http://localhost:3000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
