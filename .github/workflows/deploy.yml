name: Deploy

# The web app (apps/web) deploys automatically via Vercel's native GitHub
# integration on every push to main, so it is intentionally not handled here.
# This workflow only deploys the API to Fly.io.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-api:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    if: github.repository == 'lag59/MDMTAPCARD'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for API changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- apps/api 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up flyctl
        if: steps.changes.outputs.changed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.changes.outputs.changed == 'true'
        working-directory: apps/api
        run: flyctl deploy --remote-only --app mdm-tapcard-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
